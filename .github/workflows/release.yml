name: release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'SimileciWH/clipvault commit SHA (40-hex lowercase)'
        required: true
        type: string
      channel:
        description: 'Release channel to build and publish'
        required: true
        type: choice
        options:
          - binary
        default: binary
      main_ref:
        description: 'Main ref or branch to verify ancestry against (default: origin/main)'
        required: false
        type: string
        default: 'origin/main'
      dry_run:
        description: 'Dry run (build and gate only; do not sign, publish or register)'
        required: true
        type: boolean
        default: true

permissions: {}

concurrency:
  group: clipvault-release
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  guard:
    name: Guard target commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout private repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: SimileciWH/clipvault
          ref: ${{ inputs.sha }}
          ssh-key: ${{ secrets.CLIPVAULT_DEPLOY_KEY }}
          path: src
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch remote branches for ancestry verification
        env:
          MAIN_REF: ${{ inputs.main_ref || 'origin/main' }}
        run: |
          BRANCH="${MAIN_REF#origin/}"
          git -C src fetch origin "$BRANCH" || true

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Verify commit and ancestry
        id: check
        env:
          TARGET_COMMIT: ${{ inputs.sha }}
          MAIN_REF: ${{ inputs.main_ref || 'origin/main' }}
        run: |
          python src/scripts/release.py guard --commit "$TARGET_COMMIT" --main-ref "$MAIN_REF" --root src

  build:
    name: Build binary (${{ matrix.platform }})
    needs: guard
    if: inputs.channel == 'both' || inputs.channel == 'binary'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
            artifact: mac-arm64
            pyarch: arm64
          - runner: windows-2025
            platform: windows-x64
            artifact: windows-x64
            pyarch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout release scripts from public repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: tools
          persist-credentials: false

      - name: Checkout private repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: SimileciWH/clipvault
          ref: ${{ needs.guard.outputs.sha }}
          ssh-key: ${{ secrets.CLIPVAULT_DEPLOY_KEY }}
          path: src
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
          architecture: ${{ matrix.pyarch }}

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.24.0'

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: '20'

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements-dev.txt 'pyinstaller==6.12.0' 'cryptography==46.0.7'

      - name: Verify download regression prerequisites
        shell: bash
        env:
          TARGET_PYTHON_ARCH: ${{ matrix.pyarch }}
        run: |
          python - <<'PYTHON'
          import os
          import platform
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          assert sys.version_info[:2] == (3, 11), 'Download regression requires Python 3.11'
          machine = platform.machine().lower()
          actual = {'aarch64': 'arm64', 'amd64': 'x64', 'x86_64': 'x64'}.get(machine, machine)
          assert actual == os.environ['TARGET_PYTHON_ARCH'], f'Unexpected interpreter architecture: {actual}'
          if os.name == 'nt' and not shutil.which('openssl'):
              git_root = Path(os.environ['ProgramFiles']) / 'Git'
              for folder in (git_root / 'usr/bin', git_root / 'mingw64/bin'):
                  if (folder / 'openssl.exe').is_file():
                      os.environ['PATH'] = str(folder) + os.pathsep + os.environ['PATH']
                      with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as path_file:
                          path_file.write(str(folder) + '\n')
                      break
          assert shutil.which('openssl'), 'Real TLS fixtures require openssl on PATH'
          subprocess.run(['openssl', 'version'], check=True)
          print(f'Download regression interpreter: Python 3.11 {actual}')
          PYTHON
      - name: Download DNS and share regression (offline)
        shell: bash
        working-directory: src
        run: >
          python -m pytest -q -rfs --tb=line --timeout=60
          tests/test_dns_policy.py tests/test_networking_doh.py
          tests/test_provider_network.py tests/test_parser_throttle.py
          tests/test_download_retry.py tests/test_binary_release.py

      - name: Build binary package
        shell: bash
        env:
          TARGET_COMMIT: ${{ needs.guard.outputs.sha }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          python src/scripts/release.py build --commit "$TARGET_COMMIT" --channel binary --platform "$TARGET_PLATFORM" --root src

      - name: Smoke test binary package
        shell: bash
        timeout-minutes: 10
        env:
          TARGET_COMMIT: ${{ needs.guard.outputs.sha }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          python src/scripts/release.py smoke --commit "$TARGET_COMMIT" --channel binary --platform "$TARGET_PLATFORM" --root src

      - name: Package binary archive
        shell: bash
        env:
          TARGET_COMMIT: ${{ needs.guard.outputs.sha }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          python src/scripts/release.py package --commit "$TARGET_COMMIT" --channel binary --platform "$TARGET_PLATFORM" --root src

      - name: Gate binary archive
        shell: bash
        env:
          TARGET_COMMIT: ${{ needs.guard.outputs.sha }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          python src/scripts/release.py gate --commit "$TARGET_COMMIT" --channel binary --platform "$TARGET_PLATFORM" --root src

      - name: Leak scan
        shell: bash
        run: |
          python tools/.github/scripts/leak_scan.py --src src --dir src/dist

      - name: Upload binary artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: clipvault-client-${{ needs.guard.outputs.version }}-${{ matrix.platform }}
          path: src/dist/clipvault-client-${{ matrix.artifact }}.zip
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Sign, publish and register release
    needs: [guard, build]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && inputs.dry_run == false }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - name: Checkout release scripts from public repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: tools
          persist-credentials: false

      - name: Checkout private repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: SimileciWH/clipvault
          ref: ${{ needs.guard.outputs.sha }}
          ssh-key: ${{ secrets.CLIPVAULT_DEPLOY_KEY }}
          path: src
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install signing dependencies
        run: |
          python -m pip install 'cryptography==46.0.7'

      - name: Download all built artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: artifacts

      - name: Prepare dist directory and gate downloaded archives
        env:
          TARGET_COMMIT: ${{ needs.guard.outputs.sha }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          mkdir -p src/dist
          find artifacts -type f -name "*.zip" -exec cp {} src/dist/ \;
          python src/scripts/release.py gate --commit "$TARGET_COMMIT" --channel "$CHANNEL" --root src

      - name: Sign artifacts
        env:
          TARGET_COMMIT: ${{ needs.guard.outputs.sha }}
          CHANNEL: ${{ inputs.channel }}
          RELEASE_SIGN_PRIVATE_KEY: ${{ secrets.RELEASE_SIGN_PRIVATE_KEY }}
        run: |
          python src/scripts/release.py sign --commit "$TARGET_COMMIT" --channel "$CHANNEL" --root src

      - name: Publish to GitHub Releases
        env:
          TARGET_COMMIT: ${{ needs.guard.outputs.sha }}
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python src/scripts/release.py publish --commit "$TARGET_COMMIT" --channel "$CHANNEL" --root src

      - name: Register release on licensing server
        env:
          TARGET_COMMIT: ${{ needs.guard.outputs.sha }}
          CHANNEL: ${{ inputs.channel }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python src/scripts/release.py register --commit "$TARGET_COMMIT" --channel "$CHANNEL" --root src

      - name: Leak scan final publish set
        run: |
          python tools/.github/scripts/leak_scan.py --src src --dir src/dist/publish
